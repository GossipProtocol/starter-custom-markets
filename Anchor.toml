[toolchain]
anchor_version = "0.32.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
cue_solana = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[programs.devnet]
cue_solana = "Fg6PaFpoGXkYsidMpWTK6W2BeZ7FEfcYkg476zPFsLnS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "node tests/setup-local-usdc.mjs && npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

# Agave 3.x test validators refuse the default 0.0.0.0 bind address.
[test.validator]
bind_address = "127.0.0.1"

# The audited program pins the devnet USDC mint. tests/setup-local-usdc.mjs
# writes this account (mint authority: a local keypair in tests/.keys) before
# the suite runs. Run `node tests/setup-local-usdc.mjs` once before the first
# `anchor test`, because the validator loads the file at start.
[[test.validator.account]]
address = "4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU"
filename = "tests/.accounts/usdc-mint.json"

# After `anchor keys sync` the real program id must land in three places:
#   - this file (both [programs.*] entries)
#   - programs/cue-solana/src/lib.rs (declare_id!)
#   - the app env (NEXT_PUBLIC_MARKETS_PROGRAM_ID)
